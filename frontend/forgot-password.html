<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | FinanceTracker</title>
    <link rel="stylesheet" href="./static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="message-container"></div>

    <div class="auth-container">
        <div class="auth-sidebar">
            <div>
                <div class="auth-logo">
                    <div class="logo-icon"><i class="bi bi-coin"></i></div>
                    FinanceTracker
                </div>
                <div class="auth-menu" style="margin-top:40px;">
                    <a href="login.html">
                        <i class="bi bi-box-arrow-in-right"></i> Log In
                    </a>
                    <a href="register.html">
                        <i class="bi bi-person-plus-fill"></i> Register
                    </a>
                    <a class="active">
                        <i class="bi bi-key-fill"></i> Reset Password
                    </a>
                </div>
            </div>
            <div class="auth-sidebar-footer">Secure Financial Management</div>
        </div>

        <div class="auth-content">
            <div class="auth-card">
                <span class="auth-emoji">🔑</span>
                <h1>Forgot your password?</h1>
                <p class="subtitle">Enter your email and we'll send you a reset link</p>

                <form id="forgot-form" style="margin-top:24px;">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">
                        Send Reset Link
                    </button>
                </form>

                <p class="account-link" style="margin-top:16px;">
                    Remember your password? <a href="login.html">Log in here</a>
                </p>
            </div>
        </div>
    </div>

    <script src="./static/config.js"></script>
    <script src="./static/api.js"></script>
    <script>
    document.getElementById('forgot-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = new FormData(e.target).get('email');
        const btn = e.target.querySelector('button[type=submit]');
        btn.disabled = true;
        const r = await API.request('auth/password-reset/', { method: 'POST', body: { email } });
        btn.disabled = false;
        showAlert(r.data.detail || 'If that email is registered, a reset link has been sent.', 'success');
    });
    </script>
</body>
</html>
