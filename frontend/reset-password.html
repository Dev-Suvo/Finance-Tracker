<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | FinanceTracker</title>
    <link rel="stylesheet" href="./static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="message-container"></div>

    <div class="auth-container">
        <div class="auth-sidebar">
            <div>
                <div class="auth-logo">
                    <div class="logo-icon"><i class="bi bi-coin"></i></div>
                    FinanceTracker
                </div>
            </div>
            <div class="auth-sidebar-footer">Secure Financial Management</div>
        </div>

        <div class="auth-content">
            <div class="auth-card" id="reset-card">
                <!-- populated by JS -->
            </div>
        </div>
    </div>

    <script src="./static/config.js"></script>
    <script src="./static/api.js"></script>
    <script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('uid');
        const token = params.get('token');
        const card = document.getElementById('reset-card');

        if (!uid || !token) {
            card.innerHTML = `
                <span class="auth-emoji">⚠️</span>
                <h1>Link Expired</h1>
                <p class="subtitle">This password reset link is invalid or has expired. Please request a new one.</p>
                <a href="forgot-password.html" class="btn btn-primary" style="width:100%;padding:14px;margin-top:20px;">Request New Link</a>`;
            return;
        }

        card.innerHTML = `
            <span class="auth-emoji">🔒</span>
            <h1>Set new password</h1>
            <p class="subtitle">Enter your new password below</p>
            <div id="form-errors" style="display:none;background:var(--red-faint);color:var(--red);padding:12px 16px;border-radius:8px;font-size:13px;margin-top:16px;"></div>
            <form id="reset-form" style="margin-top:24px;">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
                    <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">Must be at least 6 characters. Include uppercase, number, and special character.</p>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">Reset Password</button>
            </form>`;

        document.getElementById('reset-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = new FormData(e.target);
            const errBox = document.getElementById('form-errors');
            const btn = e.target.querySelector('button[type=submit]');
            const r = await API.request('auth/password-reset/confirm/', {
                method: 'POST',
                body: {
                    uid,
                    token,
                    new_password: form.get('new_password'),
                    confirm_password: form.get('confirm_password'),
                },
            });
            if (r.ok) {
                card.innerHTML = `
                    <span class="auth-emoji">✅</span>
                    <h1>Password Reset Complete</h1>
                    <p class="subtitle">Your password has been updated successfully.</p>
                    <a href="login.html" class="btn btn-primary" style="width:100%;padding:14px;margin-top:20px;">Log In with New Password</a>`;
            } else {
                const errs = r.data && (r.data.errors || [r.data.detail]);
                errBox.style.display = 'block';
                errBox.innerHTML = (errs || ['Reset failed.']).map(x => '<p style="margin:2px 0;">' + x + '</p>').join('');
            }
        });
    })();
    </script>
</body>
</html>
