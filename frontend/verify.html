<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | FinanceTracker</title>
    <link rel="stylesheet" href="./static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="auth-container">
        <div class="auth-sidebar">
            <div>
                <div class="auth-logo">
                    <div class="logo-icon"><i class="bi bi-coin"></i></div>
                    FinanceTracker
                </div>
            </div>
            <div class="auth-sidebar-footer">Secure Financial Management</div>
        </div>

        <div class="auth-content">
            <div class="auth-card" id="verify-card" style="text-align:center;"></div>
        </div>
    </div>

    <script src="./static/config.js"></script>
    <script src="./static/api.js"></script>
    <script>
    (function () {
        const card = document.getElementById('verify-card');
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            card.innerHTML = '<span class="auth-emoji">⚠️</span><h1>Invalid Link</h1><p class="subtitle">No verification token was provided.</p>';
            return;
        }
        API.request('auth/verify-email/' + token + '/', { method: 'GET' })
            .then(function (r) {
                if (r.ok) {
                    card.innerHTML = `
                        <span class="auth-emoji">✅</span>
                        <h1>Email Verified!</h1>
                        <p class="subtitle">${r.data.detail}</p>
                        <a href="login.html" class="btn btn-primary" style="width:100%;padding:14px;margin-top:20px;">Log In</a>`;
                } else {
                    card.innerHTML = `
                        <span class="auth-emoji">⚠️</span>
                        <h1>Verification Failed</h1>
                        <p class="subtitle">${r.data.detail || 'Invalid or expired verification link.'}</p>
                        <a href="login.html" class="btn btn-primary" style="width:100%;padding:14px;margin-top:20px;">Back to Login</a>`;
                }
            });
    })();
    </script>
</body>
</html>
