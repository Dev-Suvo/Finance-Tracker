{% extends 'base.html' %}
{% block title %}Password Reset Complete | FinanceTracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-sidebar">
        <div>
            <div class="auth-logo">
                <div class="logo-icon"><i class="bi bi-coin"></i></div>
                FinanceTracker
            </div>
        </div>
        <div class="auth-sidebar-footer">Secure Financial Management</div>
    </div>

    <div class="auth-content">
        <div class="auth-card" style="text-align:center;">
            <span class="auth-emoji">✅</span>
            <h1>Password Reset Complete</h1>
            <p class="subtitle">Your password has been updated successfully.</p>

            <a href="{% url 'login' %}" class="btn btn-primary" style="width:100%;padding:14px;margin-top:20px;">
                Log In with New Password
            </a>
        </div>
    </div>
</div>
{% endblock %}
