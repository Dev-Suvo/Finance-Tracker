<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FinanceTracker</title>
    <link rel="stylesheet" href="./static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

    <div class="message-container"></div>

    <div class="auth-container">

        <div class="auth-sidebar">
            <div>
                <div class="auth-logo">
                    <div class="logo-icon"><i class="bi bi-coin"></i></div>
                    FinanceTracker
                </div>
                <div class="auth-menu" style="margin-top:40px;">
                    <a href="login.html">
                        <i class="bi bi-box-arrow-in-right"></i> Log In
                    </a>
                    <a class="active">
                        <i class="bi bi-person-plus-fill"></i> Register
                    </a>
                    <a href="index.html">
                        <i class="bi bi-house-fill"></i> Home
                    </a>
                </div>
            </div>
            <div class="auth-sidebar-footer">Create Your Finance Account</div>
        </div>

        <div class="auth-content">
            <div class="auth-card">

                <span class="auth-emoji">✨</span>
                <h1>Create your account</h1>
                <p class="subtitle">Fill in your details to get started with FinanceTracker</p>

                <div id="form-errors" class="errornote" style="display:none;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:14px 18px;margin-top:20px;font-size:13px;"></div>

                <form id="register-form" style="margin-top:24px;">

                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" name="first_name" class="form-control" placeholder="Enter first name" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" name="last_name" class="form-control" placeholder="Enter last name" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" name="phone_number" id="phone_number" class="form-control"
                               placeholder="Enter 10-digit phone number" inputmode="numeric" maxlength="10"
                               pattern="\d{10}" title="Phone number must be exactly 10 digits" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" id="reg-password" class="form-control" placeholder="Create password" required>
                            <div class="pw-bar-wrap">
                                <div class="pw-bar" id="pw-bar"></div>
                                <i class="bi bi-check-circle-fill pw-done" id="pw-done"></i>
                            </div>
                            <div class="pw-rules" id="pw-rules">
                                <span class="pw-rule" data-i="0">6+ characters</span>
                                <span class="pw-rule" data-i="1">Uppercase</span>
                                <span class="pw-rule" data-i="2">Number</span>
                                <span class="pw-rule" data-i="3">Special char</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <input type="password" name="confirm_password" id="reg-confirm" class="form-control" placeholder="Confirm password" required>
                            <div class="pw-match" id="pw-match" style="display:none;"></div>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">
                        Create My Account
                    </button>
                </form>

                <p class="account-link">
                    Already have an account? <a href="login.html">Log in here →</a>
                </p>

            </div>
        </div>

    </div>

    <script src="./static/config.js"></script>
    <script src="./static/api.js"></script>
    <script>
    (function () {
        const phoneInput = document.getElementById('phone_number');
        if (phoneInput) {
            phoneInput.addEventListener('input', function () {
                this.value = this.value.replace(/\D/g, '').slice(0, 10);
            });
        }

        const pw = document.getElementById('reg-password');
        const confirm = document.getElementById('reg-confirm');
        const bar = document.getElementById('pw-bar');
        const done = document.getElementById('pw-done');
        const matchEl = document.getElementById('pw-match');

        const rules = [
            v => v.length >= 6,
            v => /[A-Z]/.test(v),
            v => /\d/.test(v),
            v => /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(v),
        ];

        function updateChecks() {
            const v = pw.value;
            let passed = 0;
            rules.forEach((fn, i) => { if (fn(v)) passed++; });
            const pct = v ? (passed / rules.length * 100) : 0;
            bar.style.width = pct + '%';
            bar.className = 'pw-bar pw-bar-' + passed;
            done.style.display = passed === rules.length ? 'block' : 'none';
            document.querySelectorAll('.pw-rule').forEach((el, i) => {
                el.className = 'pw-rule ' + (rules[i](v) ? 'pw-rule-on' : (v ? 'pw-rule-fail' : ''));
            });
        }

        function updateMatch() {
            if (!confirm.value) { matchEl.style.display = 'none'; return; }
            const ok = pw.value === confirm.value;
            matchEl.style.display = 'block';
            matchEl.className = 'pw-match ' + (ok ? 'pw-match-ok' : 'pw-match-fail');
            matchEl.innerHTML = ok
                ? '<i class="bi bi-check-circle-fill"></i> Passwords match'
                : '<i class="bi bi-x-circle"></i> Passwords do not match';
        }

        pw.addEventListener('input', function () { updateChecks(); updateMatch(); });
        confirm.addEventListener('input', updateMatch);

        document.getElementById('register-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = new FormData(e.target);
            const btn = e.target.querySelector('button[type=submit]');
            const errBox = document.getElementById('form-errors');

            if (form.get('password') !== form.get('confirm_password')) {
                errBox.style.display = 'block';
                errBox.innerHTML = '<div>Passwords do not match.</div>';
                return;
            }

            btn.disabled = true;
            const payload = {
                first_name: form.get('first_name'),
                last_name: form.get('last_name'),
                username: form.get('username'),
                email: form.get('email'),
                phone_number: form.get('phone_number'),
                password: form.get('password'),
                confirm_password: form.get('confirm_password'),
            };

            const r = await API.request('auth/register/', { method: 'POST', body: payload });
            btn.disabled = false;
            if (r.ok) {
                showAlert(r.data.detail, 'success');
                setTimeout(function () { window.location.href = 'login.html'; }, 2500);
            } else {
                const errs = r.data && (r.data.errors || [r.data.detail]);
                errBox.style.display = 'block';
                errBox.innerHTML = (errs || ['Registration failed.']).map(x => '<div>' + x + '</div>').join('');
            }
        });
    })();
    </script>
</body>
</html>
