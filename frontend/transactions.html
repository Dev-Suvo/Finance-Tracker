<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Transactions | FinanceTracker</title>
    <link rel="stylesheet" href="./static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-page="dashboard" data-require-wallet>
    <div class="message-container"></div>
    <div class="layout" id="app-layout">
        <div class="main-content">

            <div class="page-header">
                <div>
                    <h1 style="font-size:20px;font-weight:700;">All Transactions</h1>
                    <p style="font-size:13px;color:var(--text-muted);margin-top:2px;" data-wallet-chip></p>
                </div>
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
                    <button type="button" class="btn btn-outline btn-sm" onclick="exportTx('csv')"><i class="bi bi-filetype-csv"></i> CSV</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="exportTx('pdf')"><i class="bi bi-filetype-pdf"></i> PDF</button>
                    <a href="dashboard.html" class="btn btn-outline btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
                    <a href="create-transaction.html" class="btn btn-primary btn-sm">+ Add Transaction</a>
                </div>
            </div>

            <form class="filter-row" id="filter-form">
                <div class="form-group search-field">
                    <label>Search</label>
                    <input type="text" name="search" id="f-search" class="form-control" placeholder="Description or category...">
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select name="type" id="f-type" class="form-control">
                        <option value="">All Types</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select name="category" id="f-category" class="form-control">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>From</label>
                    <input type="date" name="date_from" id="f-from" class="form-control">
                </div>
                <div class="form-group">
                    <label>To</label>
                    <input type="date" name="date_to" id="f-to" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> Filter</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="clearFilters()">Clear</button>
            </form>

            <div class="section-card">
                <div id="tx-table" style="overflow-x:auto;display:none;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Category</th>
                                <th>Created</th>
                                <th>Last Updated</th>
                                <th style="text-align:center;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tx-body"></tbody>
                    </table>
                </div>
                <div class="empty-state" id="tx-empty" style="padding:50px 20px;display:none;">
                    <div class="empty-icon"><i class="bi bi-receipt"></i></div>
                    <h3>No Transactions Found</h3>
                    <p id="empty-msg">Add your first transaction to get started.</p>
                    <a href="create-transaction.html" class="btn btn-primary">Add Transaction</a>
                </div>
            </div>
        </div>
    </div>

    <script src="./static/config.js"></script>
    <script src="./static/api.js"></script>
    <script src="./static/layout.js"></script>
    <script>
    (function () {
        const walletId = API.getWalletId();
        if (!walletId) return;

        const fmt = function (v) { return 'Rs. ' + parseFloat(v).toLocaleString('en-IN', { minimumFractionDigits: 2 }); };

        async function load() {
            const params = new URLSearchParams();
            const form = new FormData(document.getElementById('filter-form'));
            ['search', 'type', 'category', 'date_from', 'date_to'].forEach(function (k) {
                if (form.get(k)) params.append(k, form.get(k));
            });
            const r = await API.get('wallets/' + walletId + '/transactions/?' + params.toString());
            if (!r.ok) { showAlert(r.data.detail || 'Failed to load transactions.', 'error'); return; }
            render(r.data.transactions, params.toString() !== '');
        }

        function render(txs, filtered) {
            const body = document.getElementById('tx-body');
            const table = document.getElementById('tx-table');
            const empty = document.getElementById('tx-empty');
            if (!txs.length) {
                table.style.display = 'none';
                empty.style.display = '';
                document.getElementById('empty-msg').textContent = filtered ? 'No transactions match your filters.' : 'Add your first transaction to get started.';
                return;
            }
            table.style.display = '';
            empty.style.display = 'none';
            body.innerHTML = txs.map(function (t) {
                const income = t.transaction_type === 'Income';
                const icon = income ? 'bi-graph-up' : 'bi-graph-down';
                const color = income ? 'var(--green)' : 'var(--red)';
                const bg = income ? 'var(--green-faint)' : 'var(--red-faint)';
                return `<tr>
                    <td style="max-width:250px;padding-left:24px;">
                        <div style="display:flex;align-items:center;gap:10px;overflow:hidden;">
                            <div style="width:36px;height:36px;border-radius:10px;background:${bg};display:flex;align-items:center;justify-content:center;color:${color};flex-shrink:0;">
                                <i class="bi ${icon}" style="font-size:15px;"></i>
                            </div>
                            <div style="overflow:hidden;">
                                <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(t.description)}</div>
                                <span class="tx-type-badge ${income ? 'income' : 'expense'}">${t.transaction_type}</span>
                            </div>
                        </div>
                    </td>
                    <td style="font-weight:700;color:${color};"> ${fmt(t.amount)}</td>
                    <td><span style="background:#f1f5f9;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;color:var(--text-muted);">${escapeHtml(t.category || 'General')}</span></td>
                    <td style="font-size:12px;">
                        <div style="font-weight:600;color:var(--text-main);">${fmtDate(t.created_at)}</div>
                        <div style="color:#94a3b8;margin-top:2px;">${fmtTime(t.created_at)}</div>
                    </td>
                    <td style="font-size:12px;">
                        <div style="font-weight:600;color:var(--text-main);">${fmtDate(t.updated_at)}</div>
                        <div style="color:#94a3b8;margin-top:2px;">${fmtTime(t.updated_at)}</div>
                    </td>
                    <td style="white-space:nowrap;">
                        <div style="display:flex;gap:12px;justify-content:center;align-items:center;">
                            <a href="update-transaction.html?id=${t.transaction_id}"
                               style="width:36px;height:36px;border-radius:9px;background:var(--purple-faint);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;"
                               title="Edit"><i class="bi bi-pencil-square"></i></a>
                            <button type="button" onclick="deleteTx('${t.transaction_id}')" title="Delete"
                               style="width:36px;height:36px;border-radius:9px;background:var(--red-faint);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;border:none;cursor:pointer;">
                                <i class="bi bi-trash3-fill"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        window.deleteTx = function (id) {
            if (!confirm('Delete this transaction?')) return;
            API.del('transactions/' + id + '/').then(function (r) {
                showAlert(r.data.detail || 'Deleted.', 'success');
                load();
            });
        };

        window.exportTx = function (fmt) {
            API.get('wallets/' + walletId + '/export/' + fmt + '/', { parseAs: 'blob' }).then(function (r) {
                if (!r.ok) { showAlert(r.data && r.data.detail || 'Export failed.', 'error'); return; }
                const url = URL.createObjectURL(r.blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'transactions.' + fmt;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            });
        };

        window.clearFilters = function () {
            document.getElementById('filter-form').reset();
            load();
        };

        document.getElementById('filter-form').addEventListener('submit', function (e) { e.preventDefault(); load(); });

        // Populate category filter
        API.get('reference/').then(function (r) {
            if (!r.ok) return;
            const select = document.getElementById('f-category');
            r.data.expense_categories.concat(r.data.income_categories).forEach(function (c) {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            });
        });

        load();

        function fmtDate(iso) { return new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
        function fmtTime(iso) { return new Date(iso).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }); }
        function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    })();
    </script>
</body>
</html>
