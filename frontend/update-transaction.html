<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Transaction | FinanceTracker</title>
    <link rel="stylesheet" href="./static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-page="dashboard" data-require-wallet>
    <div class="message-container"></div>
    <div class="layout" id="app-layout">
        <div class="main-content">

            <div class="page-header">
                <div>
                    <h1 style="font-size:20px;font-weight:700;">Update Transaction</h1>
                    <p style="font-size:13px;color:var(--text-muted);margin-top:2px;">Edit your transaction details</p>
                </div>
                <a href="transactions.html" class="btn btn-outline btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            </div>

            <div class="create-card" id="card" style="display:none;">
                <form id="edit-form">
                    <div class="form-group">
                        <label>Type</label>
                        <div class="transaction-type-btns">
                            <button type="button" class="type-btn income" data-value="Income">
                                <i class="bi bi-arrow-down-circle"></i> Income</button>
                            <button type="button" class="type-btn expense" data-value="Expense">
                                <i class="bi bi-arrow-up-circle"></i> Expense</button>
                        </div>
                        <input type="hidden" name="transaction_type" id="transaction_type" required>
                    </div>

                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" step="0.01" name="amount" id="amount" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" name="description" id="description" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <select name="category" id="category" class="form-control" required></select>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">
                        Update Transaction
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="./static/config.js"></script>
    <script src="./static/api.js"></script>
    <script src="./static/layout.js"></script>
    <script src="./static/app.js"></script>
    <script>
    (async function () {
        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) { showAlert('No transaction selected.', 'error'); return; }

        const walletId = API.getWalletId();
        if (!walletId) { showAlert('Select a wallet first.', 'error'); window.location.href = 'select-wallet.html'; return; }

        const list = await API.get('wallets/' + walletId + '/transactions/');
        if (!list.ok) { showAlert(list.data.detail || 'Failed to load transaction.', 'error'); return; }
        const t = list.data.transactions.find(function (x) { return x.transaction_id === id; });
        if (!t) { showAlert('Transaction not found.', 'error'); return; }
        render(t);

        function render(t) {
            document.getElementById('card').style.display = '';
            document.getElementById('transaction_type').value = t.transaction_type;
            document.getElementById('amount').value = t.amount;
            document.getElementById('description').value = t.description;

            const isIncome = t.transaction_type === 'Income';
            document.querySelectorAll('.type-btn').forEach(function (b) {
                b.classList.toggle('active', b.dataset.value === t.transaction_type);
            });

            const cats = isIncome
                ? ['Salary', 'Freelance', 'Stipend', 'Scholarship', 'Business Revenue', 'Other']
                : ['Food', 'Transport', 'Shopping', 'Bills', 'Subscription', 'Other'];
            const select = document.getElementById('category');
            select.innerHTML = '<option value="">Select Category</option>';
            cats.forEach(function (c) {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                if (c === t.category) opt.selected = true;
                select.appendChild(opt);
            });

            document.getElementById('edit-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                const form = new FormData(e.target);
                const btn = e.target.querySelector('button[type=submit]');
                btn.disabled = true;
                const res = await API.patch('transactions/' + id + '/', {
                    transaction_type: form.get('transaction_type'),
                    amount: form.get('amount'),
                    description: form.get('description'),
                    category: form.get('category'),
                });
                btn.disabled = false;
                if (res.ok) {
                    showAlert('Transaction updated.', 'success');
                    setTimeout(function () { window.location.href = 'transactions.html'; }, 800);
                } else {
                    showAlert(res.data.detail || 'Update failed.', 'error');
                }
            });
        }
    })();
    </script>
</body>
</html>
