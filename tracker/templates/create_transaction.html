{% extends 'base.html' %}

{% block title %}
Create Transaction | FinanceTracker
{% endblock %}

{% block content %}

<div class="layout">

    <div class="sidebar">

        <div>

            <div class="sidebar-logo">
                FinanceTracker
            </div>

            <div class="sidebar-menu">

                <a href="{% url 'home' %}">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>

                <a href="{% url 'create_wallet' %}">
                    <i class="fa-solid fa-wallet"></i>
                    Create Wallet
                </a>

                <a href="{% url 'select_wallet' %}">
                    <i class="fa-solid fa-list"></i>
                    Select Wallet
                </a>

                <a href="{% url 'main_menu' %}">
                    <i class="fa-solid fa-grid-2"></i>
                    Main Menu
                </a>

            </div>

        </div>

        <div class="sidebar-menu">

            <a href="{% url 'logout' %}">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>

        </div>

    </div>


    <div class="main-content">

        <div
            class="card"
            style="max-width:800px;"
        >

            <h1>
                Add Transaction
            </h1>

            <p
                style="
                color:#6b7280;
                margin-top:10px;
                "
            >
                Wallet:
                <strong>
                    {{ wallet.wallet_name }}
                </strong>
            </p>

            <form
                method="POST"
                style="margin-top:30px;"
            >

                {% csrf_token %}

                <div class="form-group">

                    <label>
                        Transaction Type
                    </label>

                    <select
                        name="transaction_type"
                        class="form-control"
                        required
                    >
                        <option value="">
                            Select Type
                        </option>

                        <option value="Income">
                            Income
                        </option>

                        <option value="Expense">
                            Expense
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <input
                        type="text"
                        name="description"
                        class="form-control"
                        placeholder="Transaction description"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Amount
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="amount"
                        class="form-control"
                        placeholder="Enter amount"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Transaction
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
