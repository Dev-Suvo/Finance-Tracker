<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:'Segoe UI',Tahoma,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 20px;">
        <tr><td align="center">
            <table width="480" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08);">
                <tr><td style="background:linear-gradient(135deg,#7c3aed,#6d28d9);padding:32px 40px;text-align:center;">
                    <div style="font-size:24px;font-weight:700;color:#fff;">FinanceTracker</div>
                </td></tr>
                <tr><td style="padding:40px;">
                    <h2 style="margin:0 0 8px;font-size:20px;color:#111827;">Verify Your Email</h2>
                    <p style="margin:0 0 24px;font-size:14px;color:#6b7280;line-height:1.6;">
                        Please verify your email address to activate your account.
                    </p>
                    <table cellpadding="0" cellspacing="0" style="width:100%;">
                        <tr><td align="center">
                            <a href="{{ protocol }}://{{ domain }}{% url 'verify_email' token=token %}" style="display:inline-block;background:#10b981;color:#fff;text-decoration:none;padding:14px 36px;border-radius:10px;font-size:14px;font-weight:600;">
                                Verify Email
                            </a>
                        </td></tr>
                    </table>
                    <p style="margin:28px 0 0;font-size:13px;color:#94a3b8;line-height:1.6;">
                        This link will expire in 24 hours. If you didn't create this account, you can safely ignore this email.
                    </p>
                </td></tr>
                <tr><td style="padding:20px 40px;border-top:1px solid #f1f5f9;text-align:center;">
                    <p style="margin:0;font-size:12px;color:#94a3b8;">FinanceTracker &mdash; Secure Financial Management</p>
                </td></tr>
            </table>
        </td></tr>
    </table>
</body>
</html>
