{% extends 'base.html' %}

{% block title %}
Create Wallet | FinanceTracker
{% endblock %}

{% block content %}

<div class="layout">

    <div class="sidebar">

        <div>

            <div class="sidebar-logo">
                FinanceTracker
            </div>

            <div class="sidebar-menu">

                <a href="{% url 'home' %}">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>

                <a class="active">
                    <i class="fa-solid fa-wallet"></i>
                    Create Wallet
                </a>

                <a href="{% url 'select_wallet' %}">
                    <i class="fa-solid fa-list"></i>
                    Select Wallet
                </a>

            </div>

        </div>

        <div class="sidebar-menu">

            <a href="{% url 'logout' %}">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>

        </div>

    </div>


    <div class="main-content">

        <div
            class="card"
            style="
            max-width:700px;
            "
        >

            <h1>
                Create Wallet
            </h1>

            <p
                style="
                color:#6b7280;
                margin-top:10px;
                "
            >
                Create a new wallet to manage your finances.
            </p>

            <form
                method="POST"
                style="margin-top:30px;"
            >

                {% csrf_token %}

                <div class="form-group">

                    <label>
                        Wallet Name
                    </label>

                    <input
                        type="text"
                        name="wallet_name"
                        class="form-control"
                        placeholder="Enter wallet name"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Wallet
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
