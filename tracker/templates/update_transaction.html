{% extends 'base.html' %}
{% block title %}Update Transaction | FinanceTracker{% endblock %}

{% block content %}
<div class="layout">

    <div class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-logo">
                <div class="logo-icon"><i class="bi bi-coin"></i></div>
                FinanceTracker
            </div>
            <div class="sidebar-menu">
                <a href="{% url 'main_menu' %}">
                    <i class="bi bi-grid-fill"></i> Main Menu
                </a>
                <a href="{% url 'create_transaction' %}">
                    <i class="bi bi-arrow-left-right"></i> Create Transaction
                </a>
                <a href="{% url 'dashboard' %}">
                    <i class="bi bi-graph-up"></i> Dashboard
                </a>
                <a href="{% url 'create_wallet' %}">
                    <i class="bi bi-wallet2"></i> Create Wallet
                </a>
                <a href="{% url 'select_wallet' %}">
                    <i class="bi bi-list-ul"></i> Select Wallet
                </a>
            </div>
        </div>
        <div class="sidebar-menu">
            <a href="{% url 'logout' %}">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>

    <div class="main-content">

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
            <div>
                <h1 style="font-size:20px;font-weight:700;">Update Transaction</h1>
                <p style="font-size:13px;color:var(--text-muted);margin-top:2px;">Edit your transaction details</p>
            </div>
            <a href="{% url 'all_transactions' %}" class="btn btn-outline btn-sm">
                <i class="bi bi-arrow-left"></i> Back
            </a>
        </div>

        <div class="create-card">

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label>Type</label>
                    <div class="transaction-type-btns">
                        <button type="button"
                            class="type-btn income {% if transaction.transaction_type == 'Income' %}active{% endif %}"
                            data-value="Income">
                            <i class="bi bi-arrow-down-circle"></i> Income
                        </button>
                        <button type="button"
                            class="type-btn expense {% if transaction.transaction_type == 'Expense' %}active{% endif %}"
                            data-value="Expense">
                            <i class="bi bi-arrow-up-circle"></i> Expense
                        </button>
                    </div>
                    <input type="hidden" name="transaction_type" id="transaction_type"
                           value="{{ transaction.transaction_type }}" required>
                </div>

                <div class="form-group">
                    <label>Amount</label>
                    <input
                        type="number"
                        step="0.01"
                        name="amount"
                        class="form-control"
                        value="{{ transaction.amount }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <input
                        type="text"
                        name="description"
                        class="form-control"
                        value="{{ transaction.description }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select name="category" class="form-control">
                        <option value="General" {% if transaction.category == 'General' %}selected{% endif %}>General</option>
                        <option value="Food" {% if transaction.category == 'Food' %}selected{% endif %}>Food</option>
                        <option value="Transport" {% if transaction.category == 'Transport' %}selected{% endif %}>Transport</option>
                        <option value="Shopping" {% if transaction.category == 'Shopping' %}selected{% endif %}>Shopping</option>
                        <option value="Bills" {% if transaction.category == 'Bills' %}selected{% endif %}>Bills</option>
                        <option value="Others" {% if transaction.category == 'Others' %}selected{% endif %}>Others</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">
                    Update Transaction
                </button>

            </form>

        </div>
    </div>
</div>
{% endblock %}
