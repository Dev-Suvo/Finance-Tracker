{% extends 'base.html' %}

{% block start %}

<div class="transaction-container">

```
<div class="transaction-card">

    <h1>Add Transaction</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-control">

            <label>Description</label>

            <input
                type="text"
                name="description"
                placeholder="Enter description..."
                required
            >

        </div>

        <div class="form-control">

            <label>Amount</label>

            <small>
                (-100 = expense, 100 = income)
            </small>

            <input
                type="number"
                name="amount"
                placeholder="Enter amount..."
                step="0.01"
                required
            >

        </div>

        <button class="btn">
            Add Transaction
        </button>

    </form>

</div>
<a href="{% url 'index' %}" class="back-btn">← Back to Dashboard</a>

</div>

{% if messages %}

<script>
{% for message in messages %}
alert("{{ message }}")
{% endfor %}
</script>

{% endif %}

{% endblock %}
